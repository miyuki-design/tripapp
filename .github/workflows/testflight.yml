name: TripApp iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      APP_BUNDLE_ID: com.miyukidesign.tripapp
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

    steps:
      - name: Confirm distribution credentials
        env:
          DISTRIBUTION_P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for key in APPLE_TEAM_ID DISTRIBUTION_P12_B64 DISTRIBUTION_P12_PASSWORD APP_PROFILE_B64 APPSTORE_ISSUER_ID APPSTORE_API_KEY_ID APPSTORE_API_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "Missing variable or secret: $key" >&2
              exit 1
            fi
          done

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Generate iOS project
        run: |
          pnpm exec cap add ios
          pnpm exec cap sync ios

      - name: Configure iOS location permission
        run: |
          set -euo pipefail

          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :NSLocationWhenInUseUsageDescription 出張先や現在地周辺の寄り道スポットを探すために位置情報を使用します。" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string 出張先や現在地周辺の寄り道スポットを探すために位置情報を使用します。" \
            "$PLIST"

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Set TripApp iOS app icon
        run: |
          set -euo pipefail

          ICON_SOURCE="public/apple-touch-icon.png"
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          test -f "$ICON_SOURCE"
          mkdir -p "$ICON_DIR"

          sips -s format png -z 1024 1024 \
            "$ICON_SOURCE" \
            --out "$ICON_DIR/AppIcon-512@2x.png" >/dev/null

          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon-512@2x.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

      - name: Install signing certificate and profile
        env:
          DISTRIBUTION_P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/tripapp-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$DISTRIBUTION_P12_B64" | base64 -D > "$CERT_PATH"
          printf '%s' "$APP_PROFILE_B64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PATH" "$KEYCHAIN_PATH" 2>/dev/null || \
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$DISTRIBUTION_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")

          if [ "$PROFILE_APP_ID" != "${APPLE_TEAM_ID}.${APP_BUNDLE_ID}" ]; then
            echo "Provisioning profile does not match TripApp." >&2
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Configure manual signing
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = project.targets.find { |t| t.name == 'App' }
          abort 'App target not found' unless app

          release = app.build_configurations.find { |c| c.name == 'Release' }
          abort 'Release configuration not found' unless release

          settings = release.build_settings
          settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
          settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('APP_BUNDLE_ID')
          settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
          settings['CODE_SIGN_STYLE'] = 'Manual'
          settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
          settings['CURRENT_PROJECT_VERSION'] = ENV.fetch('GITHUB_RUN_NUMBER')
          settings['MARKETING_VERSION'] = '1.0.0'

          project.save
          RUBY

      - name: Create distribution archive
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TripApp.xcarchive" \
            archive

      - name: Export App Store Connect IPA
        id: export
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          import os
          import plistlib
          from pathlib import Path

          data = {
              'method': 'app-store-connect',
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'provisioningProfiles': {
                  os.environ['APP_BUNDLE_ID']: os.environ['PROFILE_NAME']
              },
              'manageAppVersionAndBuildNumber': False,
          }

          path = Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist'
          with open(path, 'wb') as f:
              plistlib.dump(data, f)
          PYCODE

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TripApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/tripapp-export"

          IPA_PATH="$(find "$RUNNER_TEMP/tripapp-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.export.outputs.ipa_path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'true'

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tripapp-signing.keychain-db" ]; then
            security delete-keychain \
              "$RUNNER_TEMP/tripapp-signing.keychain-db" || true
          fi
